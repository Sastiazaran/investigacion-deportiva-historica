name: Update football data

on:
  schedule:
    # Friday 06:00 UTC, so /data/summary.json is refreshed before a Friday reader.
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-football-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Test ROI and calibration math
        working-directory: scripts
        run: python3 -m unittest discover -s . -p "test_*.py"

      - name: Rebuild datasets
        run: python3 scripts/build_season_data.py

      - name: Rebuild NFL, NBA, and MLB summaries
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python3 scripts/build_us_sports.py

      - name: Retrain football, NFL, and MLB simulators
        working-directory: web
        run: node --experimental-strip-types scripts/calibrate-sims.ts

      - name: Refresh NBA possession ratings
        env:
          NBA_SIM_SKIP_PBP: "1"
        run: python3 scripts/nba_sim_data.py

      - name: Retrain the NBA possession backtest
        working-directory: web
        run: node --experimental-strip-types scripts/nba-backtest.ts

      - name: Score NBA total calibration
        working-directory: web
        run: node --experimental-strip-types scripts/nba-total-calibration.ts

      - name: Cache NBA box scores for season windows
        run: python3 scripts/nba_window_cache.py

      - name: Rebuild season-window ratings
        working-directory: web
        run: node --experimental-strip-types scripts/rating-windows.ts

      - name: Fail if an in-season competition is stale
        run: python3 scripts/check_freshness.py

      - name: Commit and push when the files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            canvases/season-data.json \
            web/public/data/season-data.json \
            web/public/data/matches.json \
            web/public/data/summary.json \
            web/public/data/coverage.json \
            web/public/data/nfl/summary.json \
            web/public/data/nba/summary.json \
            web/public/data/mlb/summary.json \
            web/public/data/line-dates.json \
            web/public/data/freshness.json \
            web/public/data/football/sim-factors.json \
            web/public/data/football/sim-backtest.json \
            web/public/data/nfl/sim-factors.json \
            web/public/data/nfl/sim-backtest.json \
            web/public/data/nfl/week9-check.json \
            web/public/data/mlb/sim-factors.json \
            web/public/data/mlb/sim-backtest.json \
            web/public/data/nba/team-factors.json \
            web/public/data/nba/sim-backtest.json \
            web/public/data/nba/total-calibration.json \
            web/public/data/nba/rating-windows.json \
            web/public/data/window-scores.json \
            data/mlb/games.json
          if git diff --staged --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "chore: refresh match results, ROI, and calibration"
          git push
